<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101014" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>GL-MT3600BE · 管理后台</title>
    <style>
      html { background: #101014; }
      html[data-theme="light"] { background: #f5f6f8; }
      .boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 14px;
        color: #8a8f98; font: 13px/1.4 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
      }
      .boot i {
        width: 26px; height: 26px; border-radius: 50%;
        border: 3px solid #ffffff1a; border-top-color: #38bdf8;
        animation: spin 0.8s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script>
      // 首屏前确定主题，避免闪白
      try {
        var m = localStorage.getItem('nui.theme') || 'dark'
        var dark = m === 'dark' || (m === 'auto' && matchMedia('(prefers-color-scheme: dark)').matches)
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="app">
      <div class="boot"><i></i><span>正在加载…</span></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
