# ============================================================
#  Glass Panel · 根路径接管（默认后台）
#  安装位置：/etc/nginx/gl-conf.d/zz-glass-root.conf
#
#  开启：访问路由器地址 /、/gl_home.html（原厂登录/首页）→ 302 到 /glass/
#  关闭：删除本文件即恢复原厂（不修改官方任何文件）
#  逃生：/gl_home.html?official=1 始终放行原厂界面
# ============================================================

location = / {
    access_by_lua_file /usr/share/gl-ngx/oui-access.lua;
    return 302 /glass/;
}

location = /gl_home.html {
    access_by_lua_file /usr/share/gl-ngx/oui-access.lua;
    if ($arg_official = "1") {
        rewrite ^ /__glass_official_home last;
    }
    return 302 /glass/;
}

location = /__glass_official_home {
    access_by_lua_file /usr/share/gl-ngx/oui-access.lua;
    alias /www/gl_home.html;
    default_type text/html;
    add_header Cache-Control "no-store" always;
}
