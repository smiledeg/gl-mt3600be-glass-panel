# ============================================================
#  Glass Panel · 高级后台静态资源
#  安装位置：/etc/nginx/gl-conf.d/zz-glass.conf
#  被 /etc/nginx/conf.d/gl.conf 的 include 引入（server 块内）
#
#  说明：
#   - 本文件只负责把 /glass/ 当单页应用提供，不改任何已有入口
#   - 根路径接管在 zz-glass-root.conf（安装时可选）
#   - 注意：/nui/ 由插件自带 zz-nui.conf 提供，这里不要重复声明，
#     否则同 server 内 location 重复，nginx -t 直接失败
# ============================================================

location ^~ /glass/ {
    access_by_lua_file /usr/share/gl-ngx/oui-access.lua;
    root /www;
    index index.html;
    try_files $uri $uri/ /glass/index.html;
    add_header Cache-Control "no-store" always;
}

# 自定义背景视频（界面上传后写入 /www/glass-media，文件名带随机 id，可长期缓存）
location ^~ /glass-media/ {
    root /www;
    add_header Cache-Control "public, max-age=31536000, immutable" always;
}

# 当前访问者 IP（局域网测速页显示「本机」用；同源、无缓存）
location = /glass/clientinfo {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"ip":"$remote_addr"}';
}
